# Start with:  docker compose up -d --build
# Update with: docker compose build --no-cache && docker compose up -d
services:
  hydrocore:
    build:
      context: .
      args:
        HYDROCORE_REPO: ${HYDROCORE_REPO:-https://github.com/mustafabayramguven/HydroCore.git}
        HYDROCORE_REF: ${HYDROCORE_REF:-main}
    image: hydrocore-server:latest
    container_name: hydrocore-server
    restart: unless-stopped
    ports:
      - "${HYDROCORE_PORT:-8080}:8080"
    environment:
      # Sent by the app as "Authorization: Bearer <token>" (the app's "API token" setting).
      # Empty = anyone who can reach the port may write data. Set one!
      HYDROCORE_API_TOKEN: ${HYDROCORE_API_TOKEN:-}
      # Browser login (HTTP Basic) for the dashboard and read API. Empty = open.
      HYDROCORE_DASHBOARD_USER: ${HYDROCORE_DASHBOARD_USER:-hydro}
      HYDROCORE_DASHBOARD_PASSWORD: ${HYDROCORE_DASHBOARD_PASSWORD:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      # Named volume: the SQLite database (WAL files included) lives here and survives
      # `docker compose down` and image rebuilds. Back it up by copying hydrocore.db.
      - hydrocore-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  hydrocore-data:
