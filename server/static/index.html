<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>HydroCore</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%231e88e5' d='M12 2C12 2 5 10 5 15a7 7 0 0014 0c0-5-7-13-7-13z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 2C12 2 5 10 5 15a7 7 0 0014 0c0-5-7-13-7-13z"/></svg>
      <h1>HydroCore</h1>
    </div>
    <div class="controls">
      <label class="user-pick">User <select id="user" aria-label="User"></select></label>
      <a id="export" class="btn" href="/api/export.csv" download>CSV</a>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="today">Today</button>
    <button role="tab" data-tab="week">Week</button>
    <button role="tab" data-tab="history">History</button>
  </nav>

  <main id="view" aria-live="polite"></main>
  <footer>Data is whatever the app last synced. Days you never tapped <em>Manual Sync</em> on show as “no data”.</footer>
  <script src="/app.js"></script>
</body>
</html>
