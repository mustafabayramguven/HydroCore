[package]
name = "hydrocore-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "HydroCore companion server: receives manual syncs, stores them in SQLite and serves a web dashboard."
license = "MIT"
publish = false

# Intentionally a standalone package (not part of a workspace) so the Android build in
# ../rust, its Cargo.lock and the CI workflow stay completely untouched.
[workspace]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
# `bundled` compiles SQLite into the binary: no system libsqlite3 needed (static musl build).
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
subtle = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
